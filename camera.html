<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌱 AR - Rosa Centralizada</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>

  <style>
    body{ margin:0; overflow:hidden; background:#000; font-family:'Poppins',sans-serif; }
    .media-container { position: fixed; inset: 0; z-index: 1; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: none; }
    a-scene{ position:fixed; inset:0; z-index:2; pointer-events:none;}
    
    .hint{ 
        position:fixed; bottom:80px; left:50%; transform:translateX(-50%); 
        background:rgba(0,0,0,.6); color:rgba(255,255,255,0.9); 
        padding:10px 20px; border-radius:30px; font-size:13px; z-index:10; 
        text-align:center; pointer-events: none; backdrop-filter: blur(4px); width: 85%;
    }

    .glass-btn {
        position: fixed; z-index: 100;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 24px; text-decoration: none;
        color: rgba(255, 255, 255, 0.9); font-weight: 600; font-size: 14px;
        background: rgba(255, 255, 255, 0.15); 
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3); 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        border-radius: 50px; transition: all 0.3s ease;
        cursor: pointer; user-select: none;
    }
    .glass-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }

    #backBtn { top: 20px; left: 20px; }
    #pinBtn { bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(10, 103, 108, 0.6); }
    #pinBtn.pinned { background: rgba(255, 71, 87, 0.6); border-color: rgba(255, 71, 87, 0.8); }
  </style>
</head>
<body>

  <a href="modelos.html" id="backBtn" class="glass-btn">← Voltar</a>
  <button id="pinBtn" class="glass-btn">📍 Fixar Posição</button>

  <div class="media-container">
    <video id="inputVideo" playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="hint" id="hintText">
    Aponte a câmera traseira. A rosa nascerá no centro da palma!
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-entity id="cam" camera="near:0.01; far:100; fov: 70" position="0 0 0"></a-entity>
    
    <a-entity id="arObject" position="0 0 -2" visible="false">
        <a-entity id="flower" gltf-model="assets/rosa.glb" scale="0 0 0" position="0 0 0"></a-entity>
    </a-entity>

    <a-entity light="type:ambient; intensity:1.5;"></a-entity>
    <a-entity light="type:directional; intensity:2;" position="1 4 3"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const arObject = document.getElementById('arObject');
    const flower = document.getElementById('flower');
    const pinBtn = document.getElementById('pinBtn');
    const hintText = document.getElementById('hintText');
    const camEl = document.getElementById('cam');

    // Variáveis de suavização
    let currentPos = new THREE.Vector3(0, 0, -2);
    let currentScale = 0;
    let currentRotationZ = 0;
    
    let isPinned = false; 
    let handDetected = false; 
    let startX = 0;

    // --- INTERAÇÃO TOUCH ---
    document.addEventListener('touchstart', (e) => { if(isPinned) startX = e.touches[0].clientX; });
    document.addEventListener('touchmove', (e) => {
        if (isPinned) {
            const deltaX = e.touches[0].clientX - startX;
            flower.object3D.rotation.y += deltaX * 0.01;
            startX = e.touches[0].clientX;
        }
    });

    pinBtn.addEventListener('click', () => {
        const isVisible = arObject.getAttribute('visible');
        if (!isVisible && !isPinned) { alert("Mostre a mão primeiro!"); return; }
        isPinned = !isPinned; 
        if (isPinned) {
            pinBtn.innerText = "🔓 Soltar";
            pinBtn.classList.add('pinned');
            hintText.innerText = "Fixado! Pode mover o celular.";
        } else {
            pinBtn.innerText = "📍 Fixar";
            pinBtn.classList.remove('pinned');
            hintText.innerText = "Seguindo o centro da palma...";
        }
    });

    // --- CÁLCULO EXATO DO CENTRO DO TRIÂNGULO (CENTROIDE) ---
    function getTriangleCenter(landmarks) {
        // Pega os 3 pontos: Pulso (0), Base Indicador (5), Base Mindinho (17)
        const p0 = landmarks[0];
        const p5 = landmarks[5];
        const p17 = landmarks[17];

        // Média aritmética simples para achar o centroide
        return { 
            x: (p0.x + p5.x + p17.x) / 3, 
            y: (p0.y + p5.y + p17.y) / 3 
        };
    }

    // Calcula inclinação da mão
    function getHandRotation(landmarks) {
        const p0 = landmarks[0];
        const p9 = landmarks[9];
        const dy = -(p9.y - p0.y); 
        const dx = p9.x - p0.x;
        let angleRad = Math.atan2(dy, dx);
        return angleRad - (Math.PI / 2);
    }

    function getHandAperture(landmarks) {
        const dx = landmarks[4].x - landmarks[8].x;
        const dy = landmarks[4].y - landmarks[8].y;
        let scale = Math.max(0, (Math.sqrt(dx*dx + dy*dy) - 0.02) * 15); 
        return Math.min(scale, 5); 
    }

    function updateAR(landmarks) {
        if (isPinned) return; 

        arObject.setAttribute('visible', true);
        
        // 1. Pega o centro do triângulo (0 a 1)
        const center = getTriangleCenter(landmarks);
        
        // 2. PROJEÇÃO 3D PRECISA (UNPROJECT)
        // Converte coordenadas 2D do MediaPipe para coordenadas 3D do mundo A-Frame
        const threeCamera = camEl.getObject3D('camera');
        
        // Normaliza para o espaço de dispositivo (-1 a +1)
        // X: 0..1 -> -1..1
        // Y: 0..1 -> 1..-1 (Invertido)
        const ndcX = (center.x * 2) - 1;
        const ndcY = -(center.y * 2) + 1;
        
        const vector = new THREE.Vector3(ndcX, ndcY, 0.5); // 0.5 é profundidade normalizada
        vector.unproject(threeCamera);
        
        const dir = vector.sub(threeCamera.position).normalize();
        const distance = 2; // Distância fixa da câmera (em metros)
        const targetPos = threeCamera.position.clone().add(dir.multiplyScalar(distance));

        // 3. Suavização (Lerp)
        currentPos.lerp(targetPos, 0.2); // Move 20% em direção ao alvo
        arObject.object3D.position.copy(currentPos);

        // 4. Escala e Rotação
        const targetScale = getHandAperture(landmarks);
        currentScale += (targetScale - currentScale) * 0.15; 
        flower.object3D.scale.set(currentScale, currentScale, currentScale);

        const targetRotationZ = getHandRotation(landmarks);
        currentRotationZ += (targetRotationZ - currentRotationZ) * 0.1;
        flower.object3D.rotation.z = currentRotationZ;
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
      maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handDetected = true;
        const landmarks = results.multiHandLandmarks[0];
        
        if (!isPinned) {
            // Desenha apenas o triângulo da palma para debug
            const p0 = landmarks[0]; const p5 = landmarks[5]; const p17 = landmarks[17];
            
            canvasCtx.beginPath();
            canvasCtx.moveTo(p0.x * canvasElement.width, p0.y * canvasElement.height);
            canvasCtx.lineTo(p5.x * canvasElement.width, p5.y * canvasElement.height);
            canvasCtx.lineTo(p17.x * canvasElement.width, p17.y * canvasElement.height);
            canvasCtx.closePath();
            canvasCtx.strokeStyle = "rgba(0, 255, 0, 0.5)";
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();

            // Desenha o ponto central calculado (a rosa deve ficar em cima dele)
            const center = getTriangleCenter(landmarks);
            canvasCtx.beginPath();
            canvasCtx.arc(center.x * canvasElement.width, center.y * canvasElement.height, 5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = "yellow";
            canvasCtx.fill();
        }
        updateAR(landmarks);
      } else {
        handDetected = false;
        if (!isPinned) {
            arObject.setAttribute('visible', false);
            currentScale = 0;
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({image: videoElement}); },
      width: 640, height: 480, facingMode: 'environment'
    });
    camera.start(); 
  </script>
</body>
</html>
