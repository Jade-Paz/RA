<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌱 AR - Controle de Mão</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>

  <style>
    body{ margin:0; overflow:hidden; background:#000; font-family:'Poppins',sans-serif; }
    
    .media-container { position: fixed; inset: 0; z-index: 1; }
    
    video, canvas { 
        position: absolute; inset: 0; width: 100%; height: 100%; 
        object-fit: cover; transform: scaleX(-1); 
    }
    
    a-scene{ position:fixed; inset:0; z-index:2; pointer-events:none;}
    
    /* Dica inferior */
    .hint{ 
        position:fixed; bottom:30px; left:50%; transform:translateX(-50%); 
        background:rgba(0,0,0,.6); color:rgba(255,255,255,0.9); 
        padding:10px 20px; border-radius:30px; font-size:13px; z-index:10; 
        text-align:center; pointer-events: none;
        backdrop-filter: blur(4px); /* Leve efeito glass na dica também */
    }

    /* --- BOTÃO LIQUID GLASS --- */
    .glass-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100; /* Fica acima de tudo */
        
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        padding: 10px 20px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 500;
        font-size: 14px;
        
        /* O Efeito Vidro Líquido */
        background: rgba(255, 255, 255, 0.1); /* Branco bem transparente */
        backdrop-filter: blur(12px);          /* Desfoque do fundo */
        -webkit-backdrop-filter: blur(12px);  /* Para funcionar no iPhone (Safari) */
        border: 1px solid rgba(255, 255, 255, 0.2); /* Borda sutil */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);  /* Sombra suave */
        
        border-radius: 50px;
        transition: all 0.3s ease;
    }

    .glass-btn:hover {
        background: rgba(255, 255, 255, 0.25); /* Fica mais claro ao passar o mouse */
        transform: scale(1.02);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    
    .glass-btn:active {
        transform: scale(0.95);
    }

  </style>
</head>
<body>

  <a href="modelos.html" class="glass-btn">
    ← Voltar
  </a>

  <div class="media-container">
    <video id="inputVideo" playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="hint">
    Faça o gesto de pinça (👌) para controlar o tamanho!
  </div>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-entity id="cam" camera="near:0.01; far:100" position="0 0 0"></a-entity>
    
    <a-entity id="arObject" position="0 0 -2" visible="false">
        <a-entity id="flower"
          gltf-model="assets/rosa.glb"
          scale="0 0 0"
          position="0 -0.5 0">
        </a-entity>
    </a-entity>

    <a-entity light="type:ambient; intensity:1.5;"></a-entity>
    <a-entity light="type:directional; intensity:2;" position="1 4 3"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const arObject = document.getElementById('arObject');
    const flower = document.getElementById('flower');

    let currentScale = 0;

    function getPalmCenter(landmarks) {
        const wrist = landmarks[0];
        const indexBase = landmarks[5];
        const pinkyBase = landmarks[17];
        return { 
            x: (wrist.x + indexBase.x + pinkyBase.x) / 3, 
            y: (wrist.y + indexBase.y + pinkyBase.y) / 3 
        };
    }

    function getHandAperture(landmarks) {
        const dx = landmarks[4].x - landmarks[8].x;
        const dy = landmarks[4].y - landmarks[8].y;
        let scale = Math.max(0, (Math.sqrt(dx*dx + dy*dy) - 0.02) * 15); 
        return Math.min(scale, 5); 
    }

    function updateAR(landmarks) {
        arObject.setAttribute('visible', true);
        const center = getPalmCenter(landmarks);
        
        const sensitivityX = 2.5; const sensitivityY = 1.5;
        const x = (center.x - 0.5) * sensitivityX;
        const y = -(center.y - 0.5) * sensitivityY;
        arObject.object3D.position.set(x, y, -2);

        const targetScale = getHandAperture(landmarks);
        currentScale += (targetScale - currentScale) * 0.1;
        flower.object3D.scale.set(currentScale, currentScale, currentScale);
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
      maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});
        updateAR(landmarks);
      } else {
        arObject.setAttribute('visible', false);
        currentScale = 0;
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({image: videoElement}); },
      width: 640, height: 480
    });
    camera.start(); 
  </script>
</body>
</html>
