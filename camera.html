<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌱 AR + Visualização (Debug)</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>

  <style>
    :root { --bg:#222; --text:#ffffff; }
    body{ margin:0; overflow:hidden; font-family:'Poppins',sans-serif; background:var(--bg); }
    .media-container { position: fixed; inset: 0; z-index: 1; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas.output_canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events:none; }
    a-scene{ position:fixed; inset:0; z-index:2; pointer-events:none;}
    .hint{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); color:#fff; padding:10px 20px; border-radius:30px; font-size:14px; z-index:10; text-align:center; }
    .status { font-size: 10px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="media-container">
    <video id="inputVideo" autoplay playsinline muted></video>
    <canvas id="outputCanvas" class="output_canvas"></canvas>
  </div>

  <div class="hint">
    Mostre a mão para ver o esqueleto e a rosa 🌹
    <div class="status" id="statusText">Carregando cena...</div>
  </div>

  <!-- CENA AR -->
  <a-scene embedded vr-mode-ui="enabled:false">
    <!-- Camera com near pequeno para não clippar o objeto próximo -->
    <a-entity id="cam" camera="near:0.01; far:100" position="0 1.6 0"></a-entity>
    
    <!-- Rosa: invisível até a mão aparecer -->
    <a-entity id="flower"
      gltf-model="assets/rosa.glb"
      position="0 0 0"
      scale="0 0 0"
      visible="false"
      animation__grow="property: scale; to: 5 5 5; dur: 600; easing: easeOutBack; startEvents: grow"
      animation__shrink="property: scale; to: 0 0 0; dur: 400; easing: easeIn; startEvents: shrink">
    </a-entity>

    <a-entity light="type:ambient; intensity:1.2;"></a-entity>
    <a-entity light="type:directional; intensity:1.5;" position="1 4 3"></a-entity>
  </a-scene>

  <script>
    const videoEl = document.getElementById('inputVideo');
    const canvasEl = document.getElementById('outputCanvas');
    const ctx = canvasEl.getContext('2d');
    const statusText = document.getElementById('statusText');

    const modelEl = document.getElementById('flower');
    const camEl = document.getElementById('cam');

    let isHandVisible = false;
    let mpCamera = null;
    let modelReady = false;   // <- garante que o GLB carregou

    // Debug de carga do modelo
    modelEl.addEventListener('model-loaded', () => {
      modelReady = true;
      console.log('✅ GLB carregado');
    });
    modelEl.addEventListener('model-error', (e) => {
      console.error('❌ Erro ao carregar GLB', e);
      statusText.innerText = "Erro ao carregar a rosa (ver console)";
    });

    // --------- Lógica AR (mostrar/posicionar rosa) ----------
    function updateAR(landmarks) {
      const isIndexUp = landmarks[8].y < landmarks[5].y;
      const showFlower = isIndexUp;

      if (showFlower && !isHandVisible && modelReady) {
        modelEl.setAttribute('visible', true);
        modelEl.emit('grow');
        isHandVisible = true;
      } else if (!showFlower && isHandVisible) {
        modelEl.emit('shrink');
        isHandVisible = false;
        setTimeout(() => modelEl.setAttribute('visible', false), 380);
      }

      if (!isHandVisible) return;

      // Posicionar a 0.8 m na direção da palma
      const palm = landmarks[9];
      const cam3D = camEl.getObject3D('camera');
      if (!cam3D) return;

      const ndc = new THREE.Vector3(palm.x * 2 - 1, -(palm.y * 2 - 1), 0.5);
      ndc.unproject(cam3D);
      const dir = ndc.sub(cam3D.position).normalize();
      const pos = cam3D.position.clone().add(dir.multiplyScalar(0.8)); // 0.8 m

      modelEl.object3D.position.copy(pos);
    }

    // --------- MediaPipe Hands ----------
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    function onResults(results) {
      canvasEl.width = videoEl.videoWidth || 640;
      canvasEl.height = videoEl.videoHeight || 480;

      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
        statusText.innerText = "Mão detectada!";
        const lm = results.multiHandLandmarks[0];

        // Visual debug
        drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
        drawLandmarks(ctx, lm, { color: '#FF0000', lineWidth: 2, radius: 4 });

        updateAR(lm);
      } else {
        statusText.innerText = "Procurando mão...";
        if (isHandVisible) {
          modelEl.emit('shrink');
          isHandVisible = false;
          setTimeout(() => modelEl.setAttribute('visible', false), 380);
        }
      }
      ctx.restore();
    }

    // --------- Inicialização coordenada (A-Frame -> MediaPipe) ----------
    document.querySelector('a-scene').addEventListener('loaded', () => {
      statusText.innerText = "Cena pronta. Iniciando câmera...";
      startMediaPipeCamera();
    });

    function startMediaPipeCamera() {
      if (mpCamera) return;
      mpCamera = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: 640,
        height: 480
      });
      mpCamera.start();
      statusText.innerText = "Mostre a mão para ver o esqueleto e a rosa 🌹";
    }
  </script>
</body>
</html>
