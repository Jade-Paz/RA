<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌱 AR - Controle de Mão</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>

  <style>
    body{ margin:0; overflow:hidden; background:#000; font-family:'Poppins',sans-serif; }
    .media-container { position: fixed; inset: 0; z-index: 1; }
    
    video, canvas { 
        position: absolute; inset: 0; width: 100%; height: 100%; 
        object-fit: cover; transform: scaleX(-1); 
    }
    
    a-scene{ position:fixed; inset:0; z-index:2; pointer-events:none;}
    
    /* Dica (inicialmente oculta) */
    .hint{ 
        display: none; /* Só aparece depois de iniciar */
        position:fixed; bottom:30px; left:50%; transform:translateX(-50%); 
        background:rgba(0,0,0,.7); color:#fff; padding:10px 20px; 
        border-radius:30px; font-size:14px; z-index:10; 
        text-align:center; pointer-events: none;
    }

    /* --- TELA DE INÍCIO (Obrigatória para iOS) --- */
    #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #0A676C, #222);
        z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: white; text-align: center;
    }
    
    #start-btn {
        margin-top: 20px;
        padding: 15px 30px;
        font-size: 18px; font-weight: bold;
        background: #fff; color: #0A676C;
        border: none; border-radius: 50px;
        cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s;
    }
    #start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="start-screen">
      <h1>Experiência AR</h1>
      <p>Precisamos de acesso à Câmera e Sensores.</p>
      <button id="start-btn">INICIAR EXPERIÊNCIA</button>
  </div>

  <div class="media-container">
    <video id="inputVideo" playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="hint" id="hint-box">
    Faça o gesto de pinça (👌) para controlar o tamanho!
  </div>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false">
    
    <a-entity id="cam" camera="near:0.01; far:100" position="0 0 0"></a-entity>
    
    <a-entity id="arObject" position="0 0 -2" visible="false">
        <a-entity id="flower"
          gltf-model="assets/rosa.glb"
          scale="0 0 0"
          position="0 -0.5 0">
        </a-entity>
    </a-entity>

    <a-entity light="type:ambient; intensity:1.5;"></a-entity>
    <a-entity light="type:directional; intensity:2;" position="1 4 3"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const arObject = document.getElementById('arObject');
    const flower = document.getElementById('flower');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const hintBox = document.getElementById('hint-box');

    let currentScale = 0;

    // --- FUNÇÕES DE LÓGICA AR ---
    function getPalmCenter(landmarks) {
        const wrist = landmarks[0];
        const indexBase = landmarks[5];
        const pinkyBase = landmarks[17];
        return { 
            x: (wrist.x + indexBase.x + pinkyBase.x) / 3, 
            y: (wrist.y + indexBase.y + pinkyBase.y) / 3 
        };
    }

    function getHandAperture(landmarks) {
        const dx = landmarks[4].x - landmarks[8].x;
        const dy = landmarks[4].y - landmarks[8].y;
        let scale = Math.max(0, (Math.sqrt(dx*dx + dy*dy) - 0.02) * 15); 
        return Math.min(scale, 5); 
    }

    function updateAR(landmarks) {
        arObject.setAttribute('visible', true);
        const center = getPalmCenter(landmarks);
        
        // Mapeamento
        const sensitivityX = 2.5; const sensitivityY = 1.5;
        const x = (center.x - 0.5) * sensitivityX;
        const y = -(center.y - 0.5) * sensitivityY;
        arObject.object3D.position.set(x, y, -2);

        // Escala
        const targetScale = getHandAperture(landmarks);
        currentScale += (targetScale - currentScale) * 0.1;
        flower.object3D.scale.set(currentScale, currentScale, currentScale);
    }

    // --- CONFIGURAÇÃO MEDIAPIPE ---
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
      maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});
        updateAR(landmarks);
      } else {
        arObject.setAttribute('visible', false);
        currentScale = 0;
      }
    });

    // --- INICIALIZAÇÃO SEGURA (SEM BUGS) ---
    
    // Configura a câmera mas NÃO inicia ainda
    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({image: videoElement}); },
      width: 640, height: 480
    });

    // Evento de Clique para pedir permissões
    startBtn.addEventListener('click', async () => {
        // 1. Pedir permissão de Sensores (iOS 13+)
        // Isso PRECISA ser feito dentro de um evento de clique
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const response = await DeviceMotionEvent.requestPermission();
                if (response == 'granted') {
                    console.log("Sensores permitidos");
                }
            } catch (e) {
                console.error("Erro ao pedir sensores:", e);
            }
        }

        // 2. Tentar tocar o vídeo (necessário para liberar audio/video no iOS)
        videoElement.play().catch(e => console.log("Video play setup"));

        // 3. Iniciar a câmera do MediaPipe
        await camera.start();

        // 4. Sumir com a tela de início
        startScreen.style.display = 'none';
        hintBox.style.display = 'block';
    });

  </script>
</body>
</html>
