<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Monstera AR – Sem Marcador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Zappar + A-Frame (compatível iPhone + Android) -->
<script src="https://libs.zappar.com/aframe/2.0.0/zappar-aframe.min.js"></script>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<style>
  body { margin: 0; overflow: hidden; font-family: "Poppins", sans-serif; }

  #backBtn {
    position: fixed; top: 15px; left: 15px;
    background: #0A676C; color: white;
    padding: 10px 18px; border-radius: 10px;
    z-index: 999; border: none; font-weight: 700; cursor: pointer;
  }

  #infoBtn {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1D8F8A; color: white;
    padding: 14px 20px; border-radius: 12px;
    font-weight: 800; border: none; z-index: 999;
  }

  #infoText {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: white;
    padding: 10px 15px; font-size: 15px;
    border-radius: 10px; display: none; z-index: 999;
  }
</style>
</head>

<body>

<button id="backBtn" onclick="window.location.href='modelos.html'">← Voltar</button>

<button id="infoBtn">Mostrar informação</button>
<div id="infoText">A Monstera purifica o ar e traz frescor ao ambiente.</div>

<!-- Cena AR -->
<a-scene zappar-ar>
    <!-- Câmera AR -->
    <a-entity zappar-camera></a-entity>

    <!-- Detecção de chão -->
    <a-entity zappar-instant="placement-mode: true" id="instant">
        <!-- Modelo Monstera -->
        <a-entity id="monstera"
            gltf-model="assets/monstera.glb"
            scale="0.3 0.3 0.3"
            position="0 0 0">
        </a-entity>
    </a-entity>

</a-scene>

<script>
const infoBtn = document.getElementById("infoBtn");
const infoText = document.getElementById("infoText");
let showing = false;

infoBtn.addEventListener("click", () => {
  showing = !showing;
  infoText.style.display = showing ? "block" : "none";
});
</script>

</body>
</html>
