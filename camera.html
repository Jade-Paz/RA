<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Câmera AR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #0A676C;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      z-index: 999;
      cursor: pointer;
    }
  </style>
</head>

<body>

<button id="backBtn" onclick="window.location.href='modelos.html'">← Voltar</button>

<!-- CENA AR -->
<a-scene
  webxr="requiredFeatures: hit-test;"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  embedded
>

  <!-- BOTÃO 3D DENTRO DA CÂMERA -->
  <a-plane id="btnInfo"
    position="0 1.2 -1.5"
    width="0.8"
    height="0.3"
    color="#0A676C"
    text="value: Ver Informação; align: center; color: white;"
    class="clickable">
  </a-plane>

  <!-- TEXTO QUE APARECE AO CLICAR -->
  <a-text id="infoText"
    value=""
    position="0 1 -1.5"
    width="2"
    align="center"
    color="white">
  </a-text>

  <!-- MODELO 3D -->
  <a-entity id="modelo"
    gltf-model="assets/monstera.glb"
    scale="0.3 0.3 0.3"
    visible="false">
  </a-entity>

</a-scene>

<script>
  const infoBtn = document.querySelector("#btnInfo");
  const infoText = document.querySelector("#infoText");

  infoBtn.addEventListener("click", () => {
    infoText.setAttribute("value", "Essa planta purifica o ar e é ótima para interiores!");
  });

  // Posiciona o modelo automaticamente no chão
  AFRAME.registerComponent('ar-hit-test', {
    init: function () {
      const sceneEl = this.el.sceneEl;

      sceneEl.addEventListener('enter-vr', () => {
        if (sceneEl.is('ar-mode')) {
          const model = document.querySelector("#modelo");

          this.xrSession = sceneEl.renderer.xr.getSession();

          this.xrSession.requestReferenceSpace("viewer").then((space) => {
            this.viewerSpace = space;
            return this.xrSession.requestHitTestSource({ space });
          }).then((source) => {
            this.hitTestSource = source;
          });

          this.xrSession.requestReferenceSpace("local").then((space) => {
            this.refSpace = space;
          });

          sceneEl.renderer.setAnimationLoop((time, frame) => {
            if (!frame || !this.hitTestSource) return;

            const hits = frame.getHitTestResults(this.hitTestSource);
            if (hits.length > 0) {
              const hit = hits[0];
              const pose = hit.getPose(this.refSpace);

              model.object3D.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );

              model.setAttribute("visible", true);
            }
          });
        }
      });
    }
  });

  document.querySelector("a-scene").setAttribute("ar-hit-test", "");
</script>

</body>
</html>
