<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🌱 Experiência AR – Rosa</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.min.js"></script>

  <style>
    :root { --bg:#f5e4b8; --text:#ffffff; }
    body{ margin:0; overflow:hidden; font-family:'Poppins',sans-serif; background:var(--bg ); }
    
    /* Header padrão */
    .header{
      position:fixed; inset:15px auto auto 50%; transform:translateX(-50%);
      color:var(--text); font-weight:800; font-size:clamp(18px,5vw,22px); z-index:10;
      text-shadow:1px 1px 0 rgba(255,255,255,.6);
    }
    
    /* Voltar */
    #backBtn{
      position:fixed; top:15px; left:15px; z-index:10;
      width:48px; height:48px; border-radius:50%;
      background:linear-gradient(160deg,#f6d36b,#d5a55a);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 8px rgba(0,0,0,.2); cursor:pointer; transition:.2s;
    }
    #backBtn:hover{ transform:scale(1.05); }
    #backBtn svg{ width:26px; height:26px; stroke:#3b2b1f; stroke-width:2.5; fill:none; }

    /* Feed da câmera (atrás da cena) */
    video{
      position:fixed; top:0; left:0; width:100vw; height:100vh; object-fit:cover;
      z-index:1;
    }

    /* Cena A-Frame sobre o vídeo */
    a-scene{ position:fixed; inset:0; z-index:2; }

    /* Hint discreto */
    .hint{
      position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.45); color:#fff; padding:6px 10px; border-radius:10px;
      font-size:12px; z-index:10;
    }

    /* Botão para ativar câmera traseira */
    #cameraBtn{
      position:fixed; bottom:15px; right:15px; z-index:10;
      padding:10px 16px; border:none; border-radius:10px;
      background:linear-gradient(160deg,#f6d36b,#d5a55a);
      color:#3b2b1f; font-weight:700;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
      cursor:pointer; transition:.2s;
    }
    #cameraBtn:hover{ transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="header">Experiência AR - Rosa</div>
  <div id="backBtn" title="Voltar">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </div>

  <!-- Vídeo da câmera -->
  <video id="inputVideo" autoplay playsinline muted></video>

  <!-- Cena A-Frame -->
  <a-scene embedded vr-mode-ui="enabled:false">
    <a-entity id="cameraRig">
      <a-entity id="cam" camera look-controls position="0 1.6 0"></a-entity>
    </a-entity>

    <!-- Modelo Rosa (invisível até detectar mão aberta) -->
    <a-entity id="flower"
      gltf-model="url(assets/rosa.glb)"
      scale="0.6 0.6 0.6"
      visible="false"
      animation-mixer>
    </a-entity>

    <!-- Luzes básicas -->
    <a-entity light="type:ambient; intensity:1.4; color:#ffffff"></a-entity>
    <a-entity light="type:directional; intensity:1; color:#ffffff" position="0 2 3"></a-entity>
  </a-scene>

  <div class="hint">Abra a mão para aparecer a rosa 🌹</div>
  <button id="cameraBtn">📷 Câmera Traseira</button>

  <script>
    const video = document.getElementById('inputVideo');
    const modelEl = document.getElementById('flower');
    const camEl = document.getElementById('cam');
    const cameraBtn = document.getElementById('cameraBtn');

    // Variável global para guardar a stream da câmera e o objeto Camera
    let currentStream;
    let cameraHelper;

    // ---- Detector de mão aberta (heurística leve)
    function isHandOpen(landmarks){
      const FINGERS = [
        {tip:8, pip:6}, {tip:12, pip:10}, {tip:16, pip:14}, {tip:20, pip:18}
      ];
      let extended = 0;
      for(const f of FINGERS){
        if(landmarks[f.tip].y < landmarks[f.pip].y) extended++;
      }
      const dThumb = Math.hypot(
        landmarks[4].x - landmarks[2].x,
        landmarks[4].y - landmarks[2].y
      );
      const thumbOpen = dThumb > 0.08;
      return extended >= 3 && thumbOpen;
    }

    function palmCenter(landmarks){
      const idx = [0,1,5,9,13,17];
      let x=0,y=0;
      idx.forEach(i=>{x+=landmarks[i].x;y+=landmarks[i].y;});
      return {x:x/idx.length, y:y/idx.length};
    }

    function placeAtScreenPoint(nx, ny, distanceMeters=0.6){
      const threeCam = camEl.getObject3D('camera');
      if(!threeCam) return;
      const ndcX = nx*2 - 1;
      const ndcY = -(ny*2 - 1);
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(threeCam);
      const dir = vec.sub(threeCam.position).normalize();
      const pos = threeCam.position.clone().add(dir.multiplyScalar(distanceMeters));
      modelEl.object3D.position.copy(pos);
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    } );
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.6
    });

    hands.onResults(res=>{
      if(res.multiHandLandmarks && res.multiHandLandmarks.length){
        const lm = res.multiHandLandmarks[0];
        const open = isHandOpen(lm);
        modelEl.setAttribute('visible', open);
        if(open){
          const c = palmCenter(lm);
          placeAtScreenPoint(c.x, c.y);
        }
      }else{
        modelEl.setAttribute('visible', false);
      }
    });

    // Função para parar a câmera atual
    function stopCurrentCamera() {
      if (cameraHelper) {
        cameraHelper.stop(); // Para o helper da câmera
        cameraHelper = null;
      }
      if (currentStream) {
        currentStream.getTracks().forEach(track => {
          track.stop(); // Para a trilha de vídeo (desliga a luz da câmera)
        });
        currentStream = null;
      }
    }

    async function startCamera(useBackCamera = false) {
      // 1. Para qualquer câmera que esteja rodando
      stopCurrentCamera();

      try {
        // 2. Define as restrições para a câmera desejada
        const constraints = {
          video: {
            facingMode: useBackCamera ? { exact: 'environment' } : 'user'
          },
          audio: false
        };

        // 3. Pede a nova stream de vídeo
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream; // Guarda a nova stream
        video.srcObject = stream;
        await video.play();

        // 4. Inicia o processamento do MediaPipe
        cameraHelper = new Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 640,
          height: 480
        });
        cameraHelper.start();

        console.log('✅ Câmera iniciada:', useBackCamera ? 'Traseira' : 'Frontal');
        
        // Esconde o botão se a câmera traseira for ativada com sucesso
        if (useBackCamera) {
          cameraBtn.style.display = "none";
        } else {
          cameraBtn.style.display = "block"; // Garante que o botão apareça se estiver na frontal
        }

      } catch (err) {
        console.error('❌ Erro ao acessar câmera:', err);
        // Se falhar ao tentar a traseira, tenta a frontal como fallback
        if (useBackCamera) {
            alert("Não foi possível acessar a câmera traseira. Tentando a frontal.");
            startCamera(false); // Tenta a frontal
        } else {
            alert("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
        }
      }
    }

    // Botão para ativar a câmera traseira
    cameraBtn.addEventListener('click', () => {
      startCamera(true); // Pede para usar a câmera traseira
    });

    // Voltar
    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });

    // Inicia com a câmera frontal por padrão
    startCamera(false);
  </script>

</body>
</html>
